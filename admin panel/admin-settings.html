<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Settings - Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-home="admin-dashboard.html" data-login="admin-login.html" data-requires-permission="settings.manage">
<nav>
  <div class="nav-logo" aria-label="Garden of Memories Memorial Park"><img src="../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img"><div class="nav-brand-text"><span class="brand-main">Garden of Memories Memorial Park</span><span class="brand-sub">Admin Panel</span></div></div>
  <a href="admin-login.html" id="admin-logout-link" class="nav-cta" style="text-decoration:none;">Log Out</a>
</nav>
<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <ul class="sidebar-menu">
      <li><a href="admin-dashboard.html">Dashboard</a></li>
      <li data-permission="records.view"><a href="admin-records.html">Burial Records</a></li>
      <li data-permission="map.manage"><a href="admin-map.html">Cemetery Map</a></li>
      <li data-permission="appointments.view"><a href="admin-appointments.html">Appointments</a></li>
      <li data-permission="admins.manage"><a href="admin-manage.html">Manage Admins</a></li>
      <li data-permission="activity.view"><a href="admin-activity.html">Activity Logs</a></li>
      <li data-permission="settings.manage"><a href="admin-settings.html" class="active">System Settings</a></li>
    </ul>
  </aside>
  <main class="admin-content">
    <div class="admin-header"><div><p class="section-tag" style="justify-content:flex-start;">Configuration</p><h1 class="section-title" style="margin-top:0; margin-bottom:0;">System <em>Settings</em></h1></div></div>
    <div class="settings-grid">
      <div class="settings-card">
        <h3>Park Details</h3>
        <form id="park-settings-form" class="contact-form" novalidate style="padding:0; border:none; box-shadow:none; background:transparent;">
          <div class="field-group"><label class="field-label">Park Name</label><input class="field-input" type="text" name="parkName" required><small class="field-error-text"></small></div>
          <div class="field-group"><label class="field-label">Park Hours</label><input class="field-input" type="text" name="parkHours" required><small class="field-error-text"></small></div>
          <div class="field-group"><label class="field-label">Office Hours</label><input class="field-input" type="text" name="officeHours" required><small class="field-error-text"></small></div>
          <div class="field-group"><label class="field-label">Public Contact Email</label><input class="field-input" type="email" name="publicEmail" required><small class="field-error-text"></small></div>
          <button type="submit" class="submit-btn">Save Park Details</button>
        </form>
      </div>
      <div class="settings-card">
        <h3>Admin Login</h3>
        <form id="account-settings-form" class="contact-form" novalidate style="padding:0; border:none; box-shadow:none; background:transparent;">
          <div class="field-group"><label class="field-label">Admin Name</label><input class="field-input" type="text" name="adminName" required><small class="field-error-text"></small></div>
          <div class="field-group"><label class="field-label">Admin Login Email</label><input class="field-input" type="email" name="adminEmail" required><small class="field-error-text"></small></div>
          <div class="field-group"><label class="field-label">New Password</label><input class="field-input" type="password" name="adminPassword" placeholder="Leave blank to keep current password"><small class="field-error-text"></small></div>
          <button type="submit" class="submit-btn">Update Credentials</button>
        </form>
      </div>
    </div>
  </main>
</div>
<div id="system-message-modal" class="modal-overlay" onclick="closeModal(event, 'system-message-modal')">
  <div class="modal-content" onclick="event.stopPropagation()" style="text-align:center; max-width:450px;">
    <button class="modal-close" aria-label="Close Modal" onclick="closeModal(event, 'system-message-modal')">x</button>
    <h2 class="section-title" style="margin-top:1rem; font-size:2rem;">Notification</h2>
    <p class="section-body" id="system-message-text" style="margin-bottom:1.5rem;"></p>
    <button class="search-btn" style="margin:0 auto; display:inline-block; align-self:auto;" onclick="closeModal(event, 'system-message-modal')">Okay</button>
  </div>
</div>
<script src="../visitors panel/visitors javascripts/script.js"></script>
<script src="../visitors panel/visitors javascripts/form-validation.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-pages.js"></script>
</body>
</html>
