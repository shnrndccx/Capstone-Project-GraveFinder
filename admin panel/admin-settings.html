<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<nav>
  <div class="nav-logo" aria-label="Garden of Memories Memorial Park">
    <img src="../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img">
    <div class="nav-brand-text">
      <span class="brand-main">Garden of Memories Memorial Park</span>
      <span class="brand-sub">Admin Panel</span>
    </div>
  </div>
  <a href="admin-login.html" class="nav-cta" style="text-decoration: none;">Log Out</a>
</nav>

<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <ul class="sidebar-menu">
      <li><a href="admin.html">Dashboard Overview</a></li>
      <li><a href="admin-records.html">Grave Records</a></li>
      <li><a href="admin-appointments.html">Appointments</a></li>
      <li><a href="admin-inquiries.html">Inquiries & Messages</a></li>
      <li><a href="admin-settings.html" class="active">System Settings</a></li>
    </ul>
  </aside>

  <main class="admin-content">
    <div class="admin-header">
      <div>
        <p class="section-tag" style="justify-content:flex-start;">Configuration</p>
        <h1 class="section-title" style="margin-top:0; margin-bottom:0;">System <em>Settings</em></h1>
      </div>
    </div>

    <div class="settings-grid">
      <!-- Park Information Settings -->
      <div class="settings-card">
        <h3>Park Information</h3>
        <form id="park-settings-form" class="contact-form" style="padding:0; border:none; box-shadow:none; background:transparent;">
          <div class="field-group">
            <label class="field-label">Park Name</label>
            <input class="field-input" type="text" name="parkName" required>
          </div>
          <div class="field-group">
            <label class="field-label">Park Hours</label>
            <input class="field-input" type="text" name="parkHours" required>
          </div>
          <div class="field-group">
            <label class="field-label">Office Hours</label>
            <input class="field-input" type="text" name="officeHours" required>
          </div>
          <div class="field-group">
            <label class="field-label">Public Contact Email</label>
            <input class="field-input" type="email" name="publicEmail" required>
          </div>
          <button type="submit" class="submit-btn" style="margin-top: 1rem;">Save Changes</button>
        </form>
      </div>

      <!-- Account Settings -->
      <div class="settings-card">
        <h3>Admin Account</h3>
        <form id="account-settings-form" class="contact-form" style="padding:0; border:none; box-shadow:none; background:transparent;">
          <div class="field-group">
            <label class="field-label">Admin Name</label>
            <input class="field-input" type="text" name="adminName" required>
          </div>
          <div class="field-group">
            <label class="field-label">Admin Login Email</label>
            <input class="field-input" type="email" name="adminEmail" required>
          </div>
          <div class="field-group">
            <label class="field-label">Update Password</label>
            <input class="field-input" type="password" name="adminPassword" placeholder="Enter new password to update">
          </div>
          <button type="submit" class="submit-btn" style="margin-top: 1rem;">Update Account</button>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="../visitors panel/visitors javascripts/script.js"></script>
<script src="js/admin-pages.js"></script>
</body>
</html>
