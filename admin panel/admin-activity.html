<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Logs - Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-home="admin-dashboard.html" data-login="admin-login.html" data-requires-permission="activity.view">
<nav>
  <div class="nav-logo" aria-label="Garden of Memories Memorial Park"><img src="../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img"><div class="nav-brand-text"><span class="brand-main">Garden of Memories Memorial Park</span><span class="brand-sub">Admin Panel</span></div></div>
  <a href="admin-login.html" id="admin-logout-link" class="nav-cta" style="text-decoration:none;">Log Out</a>
</nav>
<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <ul class="sidebar-menu">
      <li><a href="admin-dashboard.html">Dashboard</a></li>
      <li data-permission="records.view"><a href="admin-records.html">Burial Records</a></li>
      <li data-permission="map.manage"><a href="admin-map.html">Cemetery Map</a></li>
      <li data-permission="appointments.view"><a href="admin-appointments.html">Appointments</a></li>
      <li data-permission="admins.manage"><a href="admin-manage.html">Manage Admins</a></li>
      <li data-permission="activity.view"><a href="admin-activity.html" class="active">Activity Logs</a></li>
      <li data-permission="settings.manage"><a href="admin-settings.html">System Settings</a></li>
    </ul>
  </aside>
  <main class="admin-content">
    <div class="admin-header"><div><p class="section-tag" style="justify-content:flex-start;">Accountability</p><h1 class="section-title" style="margin-top:0; margin-bottom:0;">Activity <em>Logs</em></h1></div></div>
    <div class="admin-table-container">
      <table class="admin-table" data-activity-table>
        <thead><tr><th>Date & Time</th><th>Admin</th><th>Action</th><th>Record</th><th>Details</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>
<script src="../visitors panel/visitors javascripts/script.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-activity.js"></script>
