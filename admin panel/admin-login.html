<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Garden of Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<!-- Link to main and login specific stylesheets -->
<link rel="stylesheet" href="../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div class="login-logo" aria-label="Garden of Memories">
      <img src="../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img">
    </div>
    <h1 class="login-title">Admin Panel</h1>
    <p class="login-sub">Please enter your credentials to access the dashboard.</p>

    <!-- Credentials are checked client-side against the admin roster in js/admin-auth.js. -->
    <form id="admin-login-form" class="contact-form" novalidate style="padding:0; border:none; box-shadow:none; background:transparent; margin-top: 2.5rem;">
      <div class="field-group">
        <label class="field-label">Email Address</label>
        <input class="field-input" id="login-email" type="email" placeholder="e.g. super.admin@gardenofmemories.com" required>
        <small class="field-error-text"></small>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input class="field-input" id="login-password" type="password" required>
        <small class="field-error-text"></small>
      </div>
      <p id="login-error" class="field-error-text" style="text-align:center; font-size: 0.8rem;"></p>
      <button type="submit" class="submit-btn" style="width: 100%; margin-top: 1rem;">Log In</button>
    </form>

    <div class="login-footer">
      <a href="../visitors%20panel/index.html" class="back-main-link">
        <span aria-hidden="true">&larr;</span>
        Back to Main Site
      </a>
    </div>
  </div> 
</div>

<script src="js/admin-auth.js"></script>
<script src="../visitors panel/visitors javascripts/form-validation.js"></script>
<script>
  document.getElementById('admin-login-form').addEventListener('submit', async event => {
    event.preventDefault();

    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const password = document.getElementById('login-password').value;
    const errorText = document.getElementById('login-error');

    const result = await authenticateAdmin(email, password);

    if (result.error) {
      errorText.innerText = result.error;
      return;
    }

    setCurrentAdmin(result.admin);

    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>
