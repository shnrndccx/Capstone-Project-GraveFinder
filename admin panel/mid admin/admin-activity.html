<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-requires-role="mid_admin" data-home="../admin-login.html">

<nav>
  <div class="nav-logo" aria-label="Garden of Memories Memorial Park">
    <img src="../../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img">
    <div class="nav-brand-text">
      <span class="brand-main">Garden of Memories Memorial Park</span>
      <span class="brand-sub">Admin Panel</span>
    </div>
  </div>
  <a href="../admin-login.html" id="admin-logout-link" class="nav-cta" style="text-decoration: none;">Log Out</a>
</nav>

<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <ul class="sidebar-menu">
      <li><a href="admin-mid.html">Mid Admin Dashboard</a></li>
      <li><a href="admin-records.html">Grave Records</a></li>
      <li><a href="admin-archived.html">Archived Records</a></li>

      <li><a href="admin-activity.html" class="active">Activity History</a></li>
    </ul>

  <main class="admin-content">
    <div class="admin-header">
      <div>
        <p class="section-tag" style="justify-content:flex-start;">Accountability</p>
        <h1 class="section-title" style="margin-top:0; margin-bottom:0;">Activity <em>History</em></h1>
      </div>
    </div>

    <div class="admin-table-container">
      <table class="admin-table" data-activity-table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Admin</th>
            <th>Action</th>
            <th>Record Affected</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody></tbody>

  </main>
</div>

<script src="../../visitors panel/visitors javascripts/script.js"></script>
<script src="../js/admin-auth.js"></script>
