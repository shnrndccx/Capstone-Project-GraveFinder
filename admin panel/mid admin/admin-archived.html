<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archived Records — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-requires-role="mid_admin" data-home="../admin-login.html">

<nav>
  <div class="nav-logo" aria-label="Garden of Memories Memorial Park">
    <img src="../../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img">
    <div class="nav-brand-text">
      <span class="brand-main">Garden of Memories Memorial Park</span>
      <span class="brand-sub">Admin Panel</span>
    </div>
  </div>
  <a href="../admin-login.html" id="admin-logout-link" class="nav-cta" style="text-decoration: none;">Log Out</a>
</nav>

<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <ul class="sidebar-menu">
      <li><a href="admin-mid.html">Mid Admin Dashboard</a></li>
      <li><a href="admin-records.html">Grave Records</a></li>
      <li><a href="admin-archived.html" class="active">Archived Records</a></li>
      <li><a href="admin-appointments.html">Appointments</a></li>
      <li><a href="admin-activity.html">Activity History</a></li>
    </ul>
  </aside>

  <main class="admin-content">
    <div class="admin-header">
      <div>
        <p class="section-tag" style="justify-content:flex-start;">Database Management</p>
        <h1 class="section-title" style="margin-top:0; margin-bottom:0;">Archived <em>Records</em></h1>
      </div>
    </div>

    <div class="admin-table-container">
      <table class="admin-table" data-records-table="archived">
        <thead>
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Date of Birth</th>
            <th>Date of Death</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>

<!-- System Message Modal -->
<div id="system-message-modal" class="modal-overlay" onclick="closeModal(event, 'system-message-modal')">
  <div class="modal-content" onclick="event.stopPropagation()" style="text-align: center; max-width: 450px;">
    <button class="modal-close" aria-label="Close Modal" onclick="closeModal(event, 'system-message-modal')">✕</button>
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--sage-dark)" stroke-width="2" style="width: 48px; height: 48px; margin-bottom: 1rem; margin-top: 1rem;">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <h2 class="section-title" style="margin-top:0; font-size: 2rem;">Notification</h2>
    <p class="section-body" id="system-message-text" style="margin-bottom: 1.5rem;"></p>
    <button class="search-btn" style="margin: 0 auto; display: inline-block; align-self: auto;" onclick="closeModal(event, 'system-message-modal')">Okay</button>
  </div>
</div>

<script src="../../visitors panel/visitors javascripts/script.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin-crud.js"></script>
</body>
</html>
