<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low Admin Dashboard — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../visitors panel/visitors css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="css/low-admin.css">
</head>
<body data-requires-role="low_admin" data-home="../admin-login.html">

<nav>
  <div class="nav-logo" aria-label="Garden of Memories Memorial Park">
    <img src="../../assets/logo.png" alt="Garden of Memories Logo" class="nav-brand-img">
    <div class="nav-brand-text">
      <span class="brand-main">Garden of Memories Memorial Park</span>
      <span class="brand-sub">Admin Panel</span>
    </div>
  </div>
  <a href="../admin-login.html" id="admin-logout-link" class="nav-cta" style="text-decoration: none;">Log Out</a>
</nav>

<div class="admin-wrapper">
  <aside class="admin-sidebar">
    <ul class="sidebar-menu">
      <li><a href="admin-low.html" class="active">Low Admin Dashboard</a></li>
      <li><a href="admin-records.html">Grave Records</a></li>
      <li><a href="admin-appointments.html">Appointments</a></li>
    </ul>
  </aside>

  <main class="admin-content">
    <div class="admin-header">
      <div>
        <p class="section-tag" style="justify-content:flex-start;">View-Only Access</p>
        <h1 class="section-title" style="margin-top:0; margin-bottom:0;">Low Admin <em>Dashboard</em></h1>
      </div>
      <a href="admin-records.html" class="admin-primary-btn" style="text-decoration:none;">View Records</a>
    </div>

    <!-- SUMMARY -->
    <div class="stat-grid">
      <div class="stat-card">
        <h3>Total Grave Records</h3>
        <div class="stat-value" data-stat="total-records">0</div>
      </div>
      <div class="stat-card">
        <h3>Pending Appointments</h3>
        <div class="stat-value">14</div>
      </div>
    </div>
  </main>
</div>

<script src="../../visitors panel/visitors javascripts/script.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin-crud.js"></script>
<script src="js/low-admin.js"></script>
</body>
</html>
